[package]
name = "rust_ipflip"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_HiDpi"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
strip = true
